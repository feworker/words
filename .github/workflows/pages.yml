name: Build words and Microsoft audio
on:
  push:
    branches: [main]
    paths: [source.zip, '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: words-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract runnable source
        run: unzip -q source.zip -d extracted
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extracted/word-study/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: extracted/word-study
        run: |
          npm ci
          python -m pip install -r server/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Restore Microsoft audio cache
        uses: actions/cache@v4
        with:
          path: extracted/word-study/public/audio
          key: edge-mp3-v1-${{ runner.os }}-${{ hashFiles('extracted/word-study/src/lib/words.ts', 'extracted/word-study/scripts/generate-audio.py') }}
          restore-keys: edge-mp3-v1-${{ runner.os }}-
      - name: Generate and verify audio for all words and examples
        working-directory: extracted/word-study
        run: npm run audio:generate
      - name: Build /words/ website
        working-directory: extracted/word-study
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/word-study/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
